<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>
<f:layout name="Module"/>

<f:section name="Content">
    <f:asset.css identifier="arp-restaurant-editor" href="EXT:arp_restaurant/Resources/Public/Css/restaurant-editor.css"/>
    <f:asset.script identifier="arp-restaurant-editor-table" src="EXT:arp_restaurant/Resources/Public/JavaScript/restaurant-editor-table.js"/>

    <h1><f:translate key="{lll}heading"/></h1>
    <p class="arp-editor-note"><f:translate key="{lll}readonly.notice"/></p>

    <f:if condition="{screen.pageTitle}">
        <p class="arp-editor-page">{screen.pageTitle}</p>
    </f:if>

    <f:if condition="{bulk}">
        <f:then>
            <f:if condition="{screen.emptyState}">
                <p class="typo3-message message-notice"><f:translate key="{lll}empty.noMenus"/></p>
            </f:if>

            <f:if condition="{screen.selectedMenu}">
                <nav class="arp-editor-tabs" aria-label="Menus">
                    <f:for each="{screen.menus}" as="menuTab">
                        <span class="arp-editor-tab{f:if(condition: menuTab.active, then: ' arp-editor-tab--active')}">
                            <a href="{menuTab.url}">{menuTab.title}</a>
                            <f:if condition="{menuTab.editUrl}">
                                <a class="arp-editor-inline-link" href="{menuTab.editUrl}"><f:translate key="{lll}button.openRecord"/></a>
                            </f:if>
                        </span>
                    </f:for>
                </nav>

                <f:if condition="{screen.selectedMenu.categories}">
                    <f:then>
                        <div
                            class="arp-editor-grid arp-editor-block"
                            data-arp-editor-grid="1"
                        >
                            <span class="arp-editor-sr" data-arp-label-asc><f:translate key="{lll}table.sortAscending"/></span>
                            <span class="arp-editor-sr" data-arp-label-desc><f:translate key="{lll}table.sortDescending"/></span>
                            <div class="arp-editor-toolbar">
                                <label for="arp-editor-search-saved"><f:translate key="{lll}table.search"/></label>
                                <input
                                    id="arp-editor-search-saved"
                                    type="search"
                                    data-arp-editor-search="1"
                                    autocomplete="off"
                                    aria-describedby="arp-editor-search-saved-hint"
                                />
                                <span id="arp-editor-search-saved-hint" class="arp-editor-toolbar-hint"><f:translate key="{lll}table.searchSaved"/></span>
                                <button type="button" class="btn btn-default" data-arp-editor-reset="1">
                                    <f:translate key="{lll}table.resetOrder"/>
                                </button>
                            </div>
                            <div class="arp-editor-table-wrap">
                                <table class="arp-editor-table arp-editor-table--saved" data-arp-editor-table="1">
                                    <thead>
                                        <tr>
                                            <th scope="col" class="arp-editor-table__index">
                                                <f:translate key="{lll}column.rowIndex"/>
                                                <span class="arp-editor-sr"><f:translate key="{lll}table.rowIndexHint"/></span>
                                            </th>
                                            <th scope="col" aria-sort="none">
                                                <button type="button" class="arp-editor-sort" data-arp-sort="category" data-arp-sort-type="text">
                                                    <f:translate key="{lll}column.category"/>
                                                    <span class="arp-editor-sort-state" data-arp-sort-state></span>
                                                </button>
                                            </th>
                                            <th scope="col" aria-sort="none">
                                                <button type="button" class="arp-editor-sort" data-arp-sort="item" data-arp-sort-type="text">
                                                    <f:translate key="{lll}column.item"/>
                                                    <span class="arp-editor-sort-state" data-arp-sort-state></span>
                                                </button>
                                            </th>
                                            <th scope="col" aria-sort="none">
                                                <button type="button" class="arp-editor-sort" data-arp-sort="variant" data-arp-sort-type="text">
                                                    <f:translate key="{lll}column.variant"/>
                                                    <span class="arp-editor-sort-state" data-arp-sort-state></span>
                                                </button>
                                            </th>
                                            <th scope="col" class="arp-editor-table__price" aria-sort="none">
                                                <button type="button" class="arp-editor-sort arp-editor-sort--end" data-arp-sort="price" data-arp-sort-type="number">
                                                    <f:translate key="{lll}column.price"/>
                                                    <span class="arp-editor-sort-state" data-arp-sort-state></span>
                                                </button>
                                            </th>
                                            <th scope="col" aria-sort="none">
                                                <button type="button" class="arp-editor-sort" data-arp-sort="status" data-arp-sort-type="text">
                                                    <f:translate key="{lll}column.status"/>
                                                    <span class="arp-editor-sort-state" data-arp-sort-state></span>
                                                </button>
                                            </th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <f:for each="{screen.selectedMenu.categories}" as="category">
                                            <f:if condition="{category.placements}">
                                                <f:then>
                                                    <f:for each="{category.placements}" as="placement">
                                                        <f:if condition="{placement.priceOptions}">
                                                            <f:then>
                                                                <f:for each="{placement.priceOptions}" as="option">
                                                                    <tr data-arp-price="{option.amountMinor}">
                                                                        <td class="arp-editor-table__index" data-arp-row-index></td>
                                                                        <f:render partial="RestaurantEditor/CategoryCell" arguments="{lll: lll, category: category}"/>
                                                                        <td data-arp-col="item" data-arp-sort-value="{placement.itemTitle}">
                                                                            <span class="arp-editor-item">{placement.itemTitle}</span>
                                                                            <f:if condition="{placement.itemEditUrl}">
                                                                                <a class="arp-editor-inline-link" href="{placement.itemEditUrl}"><f:translate key="{lll}button.openItem"/></a>
                                                                            </f:if>
                                                                        </td>
                                                                        <td data-arp-col="variant">{option.displayLabel}</td>
                                                                        <td class="arp-editor-table__price" data-arp-col="price">{option.formattedAmount}</td>
                                                                        <td data-arp-col="status">
                                                                            <f:for each="{placement.statusKeys}" as="statusKey">
                                                                                <f:render partial="RestaurantEditor/Status" arguments="{lll: lll, statusKey: statusKey, skipVisible: 0}"/>
                                                                            </f:for>
                                                                        </td>
                                                                    </tr>
                                                                </f:for>
                                                            </f:then>
                                                            <f:else>
                                                                <tr data-arp-price="">
                                                                    <td class="arp-editor-table__index" data-arp-row-index></td>
                                                                    <f:render partial="RestaurantEditor/CategoryCell" arguments="{lll: lll, category: category}"/>
                                                                    <td data-arp-col="item" data-arp-sort-value="{placement.itemTitle}">
                                                                        <span class="arp-editor-item">{placement.itemTitle}</span>
                                                                        <f:if condition="{placement.itemEditUrl}">
                                                                            <a class="arp-editor-inline-link" href="{placement.itemEditUrl}"><f:translate key="{lll}button.openItem"/></a>
                                                                        </f:if>
                                                                    </td>
                                                                    <td data-arp-col="variant">—</td>
                                                                    <td class="arp-editor-table__price" data-arp-col="price"><f:translate key="{lll}empty.noPriceOptions"/></td>
                                                                    <td data-arp-col="status">
                                                                        <f:for each="{placement.statusKeys}" as="statusKey">
                                                                            <f:render partial="RestaurantEditor/Status" arguments="{lll: lll, statusKey: statusKey, skipVisible: 0}"/>
                                                                        </f:for>
                                                                    </td>
                                                                </tr>
                                                            </f:else>
                                                        </f:if>
                                                    </f:for>
                                                </f:then>
                                                <f:else>
                                                    <tr data-arp-price="">
                                                        <td class="arp-editor-table__index" data-arp-row-index></td>
                                                        <f:render partial="RestaurantEditor/CategoryCell" arguments="{lll: lll, category: category}"/>
                                                        <td data-arp-col="item"><f:translate key="{lll}empty.noPlacements"/></td>
                                                        <td data-arp-col="variant">—</td>
                                                        <td class="arp-editor-table__price" data-arp-col="price"></td>
                                                        <td data-arp-col="status">
                                                            <f:for each="{category.statusKeys}" as="statusKey">
                                                                <f:render partial="RestaurantEditor/Status" arguments="{lll: lll, statusKey: statusKey, skipVisible: 0}"/>
                                                            </f:for>
                                                        </td>
                                                    </tr>
                                                </f:else>
                                            </f:if>
                                        </f:for>
                                    </tbody>
                                </table>
                            </div>
                            <p class="arp-editor-empty" hidden="hidden" data-arp-editor-empty="1"><f:translate key="{lll}table.emptyFilter"/></p>
                        </div>
                    </f:then>
                    <f:else>
                        <p class="arp-editor-empty"><f:translate key="{lll}empty.noCategories"/></p>
                    </f:else>
                </f:if>
            </f:if>

            <details class="arp-editor-bulk" open>
                <summary><f:translate key="{lll}bulk.heading"/></summary>
                <p class="arp-editor-note"><f:translate key="{lll}bulk.previewOnly"/></p>
                <p class="arp-editor-note"><f:translate key="{lll}bulk.help"/></p>

                <f:if condition="{bulk.requestError}">
                    <p class="typo3-message message-error">
                        <f:switch expression="{bulk.requestError}">
                            <f:case value="invalidCsrf"><f:translate key="{lll}bulk.error.invalidCsrf"/></f:case>
                        </f:switch>
                    </p>
                </f:if>

                <form action="{bulk.formAction}" method="post" class="arp-editor-bulk-form">
                    <input type="hidden" name="id" value="{bulk.pid}"/>
                    <input type="hidden" name="menu" value="{bulk.menuUid}"/>
                    <input type="hidden" name="formToken" value="{bulk.formToken}"/>
                    <label for="arp-bulk-paste" class="arp-editor-bulk-label"><f:translate key="{lll}bulk.pasteLabel"/></label>
                    <textarea id="arp-bulk-paste" name="bulkPaste" rows="10" cols="80" maxlength="{bulk.maxBytes}" class="arp-editor-bulk-paste">{bulk.rawInput}</textarea>
                    <p>
                        <button type="submit" name="bulkPreview" value="1" class="btn btn-default">
                            <f:translate key="{lll}bulk.preview"/>
                        </button>
                    </p>
                </form>

                <f:if condition="{bulk.result}">
                    <f:if condition="{bulk.result.globalError}">
                        <f:then>
                            <p class="typo3-message message-error">
                                <f:switch expression="{bulk.result.globalError}">
                                    <f:case value="emptyPaste"><f:translate key="{lll}bulk.error.emptyPaste"/></f:case>
                                    <f:case value="inputTooLarge"><f:translate key="{lll}bulk.error.inputTooLarge"/></f:case>
                                    <f:case value="tooManyRows"><f:translate key="{lll}bulk.error.tooManyRows"/></f:case>
                                </f:switch>
                            </p>
                        </f:then>
                        <f:else>
                            <p class="arp-editor-note">
                                <f:translate key="{lll}bulk.summary" arguments="{0: bulk.result.validCount, 1: bulk.result.invalidCount}"/>
                            </p>
                            <div
                                class="arp-editor-grid arp-editor-block"
                                data-arp-editor-grid="1"
                            >
                                <span class="arp-editor-sr" data-arp-label-asc><f:translate key="{lll}table.sortAscending"/></span>
                                <span class="arp-editor-sr" data-arp-label-desc><f:translate key="{lll}table.sortDescending"/></span>
                                <div class="arp-editor-toolbar">
                                    <label for="arp-editor-search-preview"><f:translate key="{lll}table.search"/></label>
                                    <input
                                        id="arp-editor-search-preview"
                                        type="search"
                                        data-arp-editor-search="1"
                                        autocomplete="off"
                                        aria-describedby="arp-editor-search-preview-hint"
                                    />
                                    <span id="arp-editor-search-preview-hint" class="arp-editor-toolbar-hint"><f:translate key="{lll}table.searchPreview"/></span>
                                    <button type="button" class="btn btn-default" data-arp-editor-reset="1">
                                        <f:translate key="{lll}table.resetOrder"/>
                                    </button>
                                </div>
                                <div class="arp-editor-table-wrap">
                                    <table class="arp-editor-table arp-editor-table--preview" data-arp-editor-table="1">
                                        <thead>
                                            <tr>
                                                <th scope="col" class="arp-editor-table__index">
                                                    <f:translate key="{lll}column.rowIndex"/>
                                                    <span class="arp-editor-sr"><f:translate key="{lll}table.rowIndexHint"/></span>
                                                </th>
                                                <th scope="col" aria-sort="none">
                                                    <button type="button" class="arp-editor-sort" data-arp-sort="category" data-arp-sort-type="text">
                                                        <f:translate key="{lll}column.category"/>
                                                        <span class="arp-editor-sort-state" data-arp-sort-state></span>
                                                    </button>
                                                </th>
                                                <th scope="col" aria-sort="none">
                                                    <button type="button" class="arp-editor-sort" data-arp-sort="item" data-arp-sort-type="text">
                                                        <f:translate key="{lll}column.item"/>
                                                        <span class="arp-editor-sort-state" data-arp-sort-state></span>
                                                    </button>
                                                </th>
                                                <th scope="col" aria-sort="none">
                                                    <button type="button" class="arp-editor-sort" data-arp-sort="variant" data-arp-sort-type="text">
                                                        <f:translate key="{lll}column.variant"/>
                                                        <span class="arp-editor-sort-state" data-arp-sort-state></span>
                                                    </button>
                                                </th>
                                                <th scope="col" class="arp-editor-table__price" aria-sort="none">
                                                    <button type="button" class="arp-editor-sort arp-editor-sort--end" data-arp-sort="price" data-arp-sort-type="number">
                                                        <f:translate key="{lll}column.price"/>
                                                        <span class="arp-editor-sort-state" data-arp-sort-state></span>
                                                    </button>
                                                </th>
                                                <th scope="col" class="arp-editor-table__line" aria-sort="none">
                                                    <button type="button" class="arp-editor-sort arp-editor-sort--end" data-arp-sort="line" data-arp-sort-type="number">
                                                        <f:translate key="{lll}bulk.column.line"/>
                                                        <span class="arp-editor-sort-state" data-arp-sort-state></span>
                                                    </button>
                                                </th>
                                                <th scope="col" aria-sort="none">
                                                    <button type="button" class="arp-editor-sort" data-arp-sort="status" data-arp-sort-type="text">
                                                        <f:translate key="{lll}column.status"/>
                                                        <span class="arp-editor-sort-state" data-arp-sort-state></span>
                                                    </button>
                                                </th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <f:for each="{bulk.result.rows}" as="row">
                                                <f:variable name="categoryErrorClass" value=""/>
                                                <f:variable name="itemErrorClass" value=""/>
                                                <f:variable name="priceErrorClass" value=""/>
                                                <f:for each="{row.errors}" as="errorCode">
                                                    <f:if condition="{errorCode} == 'missingCategory'">
                                                        <f:variable name="categoryErrorClass" value="arp-editor-cell--error"/>
                                                    </f:if>
                                                    <f:if condition="{errorCode} == 'missingItem'">
                                                        <f:variable name="itemErrorClass" value="arp-editor-cell--error"/>
                                                    </f:if>
                                                    <f:if condition="{errorCode} == 'missingPrice' || {errorCode} == 'invalidPrice' || {errorCode} == 'negativePrice' || {errorCode} == 'tooManyDecimals'">
                                                        <f:variable name="priceErrorClass" value=" arp-editor-cell--error"/>
                                                    </f:if>
                                                </f:for>
                                                <tr data-arp-price="{row.amountMinor}" data-arp-line="{row.sourceLine}">
                                                    <td class="arp-editor-table__index" data-arp-row-index></td>
                                                    <td data-arp-col="category" class="{categoryErrorClass}">{row.category}</td>
                                                    <td data-arp-col="item" class="{itemErrorClass}">
                                                        <span class="arp-editor-item">{row.item}</span>
                                                    </td>
                                                    <td data-arp-col="variant">{row.variantDisplay}</td>
                                                    <td class="arp-editor-table__price{priceErrorClass}" data-arp-col="price">
                                                        <f:if condition="{row.valid}">
                                                            <f:then>{row.formattedAmount}</f:then>
                                                            <f:else>{row.priceRaw}</f:else>
                                                        </f:if>
                                                    </td>
                                                    <td class="arp-editor-table__line" data-arp-col="line">{row.sourceLine}</td>
                                                    <td data-arp-col="status">
                                                        <f:if condition="{row.valid}">
                                                            <f:then><f:translate key="{lll}bulk.row.valid"/></f:then>
                                                            <f:else>
                                                                <f:for each="{row.errors}" as="errorCode">
                                                                    <span class="arp-editor-validation">
                                                                        <f:switch expression="{errorCode}">
                                                                            <f:case value="missingCategory"><f:translate key="{lll}bulk.error.missingCategory"/></f:case>
                                                                            <f:case value="missingItem"><f:translate key="{lll}bulk.error.missingItem"/></f:case>
                                                                            <f:case value="missingPrice"><f:translate key="{lll}bulk.error.missingPrice"/></f:case>
                                                                            <f:case value="invalidPrice"><f:translate key="{lll}bulk.error.invalidPrice"/></f:case>
                                                                            <f:case value="negativePrice"><f:translate key="{lll}bulk.error.negativePrice"/></f:case>
                                                                            <f:case value="tooManyDecimals"><f:translate key="{lll}bulk.error.tooManyDecimals"/></f:case>
                                                                        </f:switch>
                                                                    </span>
                                                                </f:for>
                                                            </f:else>
                                                        </f:if>
                                                    </td>
                                                </tr>
                                            </f:for>
                                        </tbody>
                                    </table>
                                </div>
                                <p class="arp-editor-empty" hidden="hidden" data-arp-editor-empty="1"><f:translate key="{lll}table.emptyFilter"/></p>
                            </div>
                        </f:else>
                    </f:if>
                </f:if>
            </details>
        </f:then>
        <f:else>
            <p class="typo3-message message-notice">
                <f:switch expression="{screen.emptyState}">
                    <f:case value="selectPage"><f:translate key="{lll}empty.selectPage"/></f:case>
                    <f:case value="noPageAccess"><f:translate key="{lll}empty.noPageAccess"/></f:case>
                    <f:case value="noTableAccess"><f:translate key="{lll}empty.noTableAccess"/></f:case>
                    <f:defaultCase><f:translate key="{lll}empty.selectPage"/></f:defaultCase>
                </f:switch>
            </p>
        </f:else>
    </f:if>
</f:section>
</html>
